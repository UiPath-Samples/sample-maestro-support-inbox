name: "💡 Feature Request"
description: Suggest an improvement to this sample or the tutorial it supports
title: "(short description of the request)"
labels: [enhancement, needs-triage]
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe what you are trying to do with this sample and where it falls short.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you tried or considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, or anything else that helps explain the request.
    validations:
      required: false
